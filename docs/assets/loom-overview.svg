<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Loom: ordinary functions, recorded effects</title>
  <desc id="description">A browser REPL calls Rust actors. Actors perform effects through the Rust host, which suspends and resumes their execution. The host records events and stores content and results in the CAS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8b8b87" stroke-width="1.5"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #292927; }
      .label { font-size: 12px; letter-spacing: 1.8px; fill: #787874; }
      .heading { font-size: 23px; font-weight: 600; letter-spacing: -.5px; }
      .body { font-size: 15px; fill: #676763; }
      .code { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 14px; fill: #42423e; }
      .box { fill: #fff; stroke: #deded8; }
      .line { fill: none; stroke: #8b8b87; stroke-width: 1.4; }
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="418" rx="16" fill="#f8f8f5" stroke="#e5e5df"/>
  <text x="38" y="45" class="label">LOOM</text>
  <text x="38" y="82" class="heading">Ordinary functions. Recorded effects.</text>
  <rect x="38" y="120" width="264" height="196" rx="10" class="box"/>
  <text x="60" y="153" class="label">01 / INTERACT</text>
  <text x="60" y="191" class="heading">The REPL</text>
  <text x="60" y="224" class="body">Define, call, inspect.</text>
  <path d="M60 245 H280" stroke="#eeeeea"/>
  <text x="60" y="277" class="code">&gt; main()</text>
  <rect x="352" y="120" width="264" height="196" rx="10" class="box"/>
  <text x="374" y="153" class="label">02 / COMPOSE</text>
  <text x="374" y="191" class="heading">TS + Rust actors</text>
  <text x="374" y="224" class="body">Messages in. Events out.</text>
  <path d="M374 245 H594" stroke="#eeeeea"/>
  <text x="374" y="277" class="code">call · fork · join</text>
  <rect x="666" y="120" width="264" height="196" rx="10" class="box"/>
  <text x="688" y="153" class="label">03 / PERFORM</text>
  <text x="688" y="191" class="heading">The effect host</text>
  <text x="688" y="224" class="body">Suspend. Run. Resume.</text>
  <path d="M688 245 H908" stroke="#eeeeea"/>
  <text x="688" y="277" class="code">perform(desc)</text>
  <rect x="980" y="120" width="262" height="196" rx="10" class="box"/>
  <text x="1002" y="153" class="label">04 / REMEMBER</text>
  <text x="1002" y="191" class="heading">Event log + CAS</text>
  <text x="1002" y="224" class="body">History, code, results.</text>
  <path d="M1002 245 H1220" stroke="#eeeeea"/>
  <text x="1002" y="277" class="code">BLAKE3 · CID links</text>
  <path d="M310 216 H343" class="line" marker-end="url(#arrow)"/>
  <path d="M624 216 H657" class="line" marker-end="url(#arrow)"/>
  <path d="M938 216 H971" class="line" marker-end="url(#arrow)"/>
  <path d="M1111 326 V359 H484 V326" class="line" marker-end="url(#arrow)"/>
  <rect x="688" y="346" width="220" height="25" fill="#f8f8f5"/>
  <text x="704" y="364" class="body">Replay from recorded history</text>
</svg>
