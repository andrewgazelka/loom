[package]
name = "loom-action"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
libc = "0.2"
loom-process = { path = "../loom-process" }
loom-store = { path = "../loom-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "rt", "macros", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
