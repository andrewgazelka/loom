[package]
name = "loom-api"
version = "0.1.0"
edition = "2024"
[dependencies]
loom-actor = { path = "../loom-actor" }
toml = "0.8"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
tar = "0.4"
loom-proto = { path = "../loom-proto" }
loom-store = { path = "../loom-store" }
loom-check = { path = "../loom-check" }
loom-build = { path = "../loom-build" }
loom-rt = { path = "../loom-rt" }
loom-maintenance = { path = "../loom-maintenance" }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
