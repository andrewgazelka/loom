[package]
name = "loom-api"
version = "0.1.0"
edition = "2024"
[dependencies]
tempfile = "3"
loom-imports = { path = "../loom-imports" }
loom-v8 = { path = "../loom-v8" }
loom-behavior = { path = "../loom-behavior" }
loom-actor = { path = "../loom-actor" }
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
tar = "0.4"
loom-proto = { path = "../loom-proto" }
loom-store = { path = "../loom-store" }
loom-check = { path = "../loom-check" }
loom-build = { path = "../loom-build" }
loom-rt = { path = "../loom-rt" }
loom-maintenance = { path = "../loom-maintenance" }
wasmparser = "0.254"
wasmprinter = "0.254"
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
