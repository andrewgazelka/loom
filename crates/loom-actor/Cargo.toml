[package]
name = "loom-actor"
version = "0.1.0"
edition = "2024"
autotests = false
license = "MIT OR Apache-2.0"

[dependencies]
loom-process = { path = "../loom-process" }
turso = "0.7.2"
turso_core = "0.7.2"
turso_parser = "0.7.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
blake3 = "1"
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object_store = { version = "0.14.1", features = ["aws"] }
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
loom-store = { path = "../loom-store" }
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["net"] }

[[test]]
name = "cluster"
path = "tests/cluster.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

[target.'cfg(target_os = "linux")'.dependencies]
turso_core = { version = "0.7.2", features = ["io_uring"] }

[[test]]
name = "caps"
path = "tests/caps.rs"

[[test]]
name = "view"
path = "tests/view.rs"

[[test]]
name = "drivers"
path = "tests/drivers.rs"

[[test]]
name = "process_driver"
path = "tests/process_driver.rs"

[[test]]
name = "named"
path = "tests/named.rs"

[[test]]
name = "container_driver"
path = "tests/container_driver.rs"

[[test]]
name = "lifecycle_hooks"
path = "tests/lifecycle_hooks.rs"
