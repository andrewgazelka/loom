[package]
name = "loom-actor"
version = "0.1.0"
edition = "2024"
autotests = false
license = "MIT OR Apache-2.0"

[dependencies]
turso = "0.7.2"
turso_parser = "0.7.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
blake3 = "1"
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object_store = { version = "0.14.1", features = ["aws"] }
futures-core = "0.3"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "durability"
path = "tests/durability.rs"

[target.'cfg(target_os = "linux")'.dependencies]
turso_core = { version = "0.7.2", features = ["io_uring"] }
