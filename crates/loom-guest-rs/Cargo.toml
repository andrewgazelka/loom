[package]
name = "loom-guest-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vector math for guests. `libm` (not the platform libm) and no SIMD: the same bits on every host.
glam = { version = "0.33", default-features = false, features = ["libm", "scalar-math", "all-types"] }
loom-proto = { path = "../loom-proto" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = "=0.2.14"
