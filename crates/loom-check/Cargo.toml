[package]
name = "loom-check"
version = "0.1.0"
edition = "2024"
[dependencies]
loom-proto = { path = "../loom-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt"] }
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
prettyplease = "0.2"
toml = "0.8"
base64 = "0.22"
proc-macro2 = "1"
