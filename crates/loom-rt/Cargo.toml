[package]
name = "loom-rt"
version.workspace = true
edition.workspace = true
[dependencies]
loom-proto = { path = "../loom-proto" }
loom-store = { path = "../loom-store" }
loom-process = { path = "../loom-process" }
loom-model = { path = "../loom-model" }
anyhow = "1"
serde_json = "1"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "48.0.0", default-features = false, features = ["anyhow", "async", "component-model", "cranelift", "runtime", "pooling-allocator", "std", "wat"] }

serde = { version = "1", features = ["derive"] }
tempfile = "3"
