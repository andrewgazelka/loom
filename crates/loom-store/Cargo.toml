[package]
name = "loom-store"
version = "0.1.0"
edition = "2024"
[dependencies]
loom-proto = { path = "../loom-proto" }
anyhow = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
tempfile = "3"
