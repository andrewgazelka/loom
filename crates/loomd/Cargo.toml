[package]
name = "loomd"
version = "0.1.0"
edition = "2024"
[dependencies]
tower = { version = "0.5", features = ["util"] }
loom-behavior = { path = "../loom-behavior" }
loom-v8 = { path = "../loom-v8" }
loom-process = { path = "../loom-process" }
serde = { version = "1", features = ["derive"] }
blake3 = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
loom-api = { path = "../loom-api" }
loom-build = { path = "../loom-build" }
loom-mcp = { path = "../loom-mcp" }
loom-store = { path = "../loom-store" }
loom-proto = { path = "../loom-proto" }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
url = "2"

loom-actor = { path = "../loom-actor" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
