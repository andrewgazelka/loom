[package]
name = "loom-cli"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "loom"
path = "src/main.rs"
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
loom-proto = { path = "../loom-proto" }
