[package]
name = "loom-vm-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
libloading = "=0.8.9"
loom-proto = { path = "../loom-proto" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
