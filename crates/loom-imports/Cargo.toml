[package]
name = "loom-imports"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
loom-proto = { path = "../loom-proto" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "fs", "io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
