[package]
name = "loom-mcp"
version = "0.1.0"
edition = "2024"
[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "0.17", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"
uuid = { version = "1", features = ["v4"] }
loom-api = { path = "../loom-api" }
loom-proto = { path = "../loom-proto" }

loom-actor = { path = "../loom-actor" }
[dev-dependencies]
rmcp = { version = "0.17", features = ["client"] }
loom-store = { path = "../loom-store" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
async-trait = "0.1"
