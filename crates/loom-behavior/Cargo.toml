[package]
name = "loom-behavior"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[dependencies]
loom-actor = { path = "../loom-actor" }
loom-rt = { path = "../loom-rt" }
loom-store = { path = "../loom-store" }
loom-proto = { path = "../loom-proto" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
loom-build = { path = "../loom-build" }
loom-check = { path = "../loom-check" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process"] }
tempfile = "3"
blake3 = "1"

[[example]]
name = "loom-behavior-fixtures"
path = "tests/fixture_builder.rs"

[[test]]
name = "behavior"
path = "tests/behavior.rs"
