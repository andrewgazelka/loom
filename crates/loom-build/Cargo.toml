[package]
name = "loom-build"
version = "0.1.0"
edition = "2024"
[dependencies]
loom-proto = { path = "../loom-proto" }
loom-check = { path = "../loom-check" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "sync", "time"] }
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
toml = "0.8"
blake3 = "1"
