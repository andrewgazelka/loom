[package]
name = "loom-build"
version = "0.1.0"
edition = "2024"
[dependencies]
loom-proto = { path = "../loom-proto" }
loom-check = { path = "../loom-check" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "sync", "time"] }
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
toml = "0.8"
blake3 = "1"
loom-store = { path = "../loom-store" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

wasmparser = "0.254"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
wasm-encoder = "0.254"
gimli = { version = "0.33", default-features = false, features = ["read", "write"] }
